# Emails one digest of newly implemented projects, at most once a day.
#
# The send decision lives in scripts/notify-implemented.mjs: it compares
# implemented.json against notify-state.json and exits quietly when nothing is
# new, so a quiet day sends no email. The state file is committed back with
# [skip ci] so the commit does not trigger this workflow again or a Netlify
# rebuild.
name: Notify implemented projects

on:
  schedule:
    # Both fire; the script drops whichever lands before 9am Pacific and the
    # once-a-day guard drops the other, so the send is 9:10am local year-round
    # (16:10 UTC is 9:10am PDT, 17:10 UTC is 9:10am PST). GitHub can delay a
    # scheduled run when it is busy.
    - cron: '10 16 * * *'
    - cron: '10 17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render the email to the log without sending'
        type: boolean
        default: false
      force:
        description: 'Send even if one already went out today'
        type: boolean
        default: false

permissions:
  contents: write

# Never let a manual run and the scheduled run send at the same time.
concurrency:
  group: notify-implemented
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          args=''
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          [ "${{ inputs.force }}" = "true" ] && args="$args --force"
          # Only the scheduled pair needs the Pacific-morning guard; a manual
          # run should send when you ask for it.
          [ "${{ github.event_name }}" = "schedule" ] && args="$args --not-before-pacific-hour=9"
          node scripts/notify-implemented.mjs $args

      - name: Record what was sent
        run: |
          if git diff --quiet -- notify-state.json; then
            echo "notify-state.json unchanged; nothing to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notify-state.json
          git commit -m 'Record implemented-project email [skip ci]'
          # main may have moved while this ran (the daily idea routine pushes too).
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $attempt failed; retrying"
            sleep 5
          done
          exit 1
