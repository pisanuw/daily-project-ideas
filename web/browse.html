<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Search and filter every idea by who it is for and by topic. Each one is software HintWise could build for you." />
  <link rel="canonical" href="https://studio.hintwise.org/browse.html" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e1015" media="(prefers-color-scheme: dark)" />
  <meta property="og:site_name" content="HintWise Studio" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Browse ideas · Next up · HintWise Studio" />
  <meta property="og:description" content="Search and filter every idea by who it is for and by topic. Each one is software HintWise could build for you." />
  <meta property="og:url" content="https://studio.hintwise.org/browse.html" />
  <meta property="og:image" content="https://studio.hintwise.org/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="HintWise Studio: small, focused software for small businesses, startups and educators" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Browse ideas · Next up · HintWise Studio" />
  <meta name="twitter:description" content="Search and filter every idea by who it is for and by topic. Each one is software HintWise could build for you." />
  <meta name="twitter:image" content="https://studio.hintwise.org/og-image.png" />
  <!-- @favicon -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="browse">
  <!-- @nav:next-up -->
  <header class="pagehead wrap">
    <p class="eyebrow"><a href="next-up.html">Next up</a></p>
    <h1 class="pagehead__title" id="browse-title">Browse all ideas</h1>
    <p class="pagehead__sub" id="browse-sub"></p>
  </header>

  <div class="controls">
    <div class="wrap">
      <div class="search">
        <input type="search" id="q" class="search__input" placeholder="Search titles, summaries and descriptions"
               autocomplete="off" aria-label="Search ideas" />
        <button class="search__clear" id="q-clear" type="button" aria-label="Clear search" hidden>&times;</button>
      </div>
      <div class="filters" id="filters"></div>
      <p class="controls__meta"><span id="result-count"></span><button class="link-btn" id="reset" type="button" hidden>Clear all filters</button></p>
    </div>
  </div>

  <main class="wrap" id="main">
    <div class="grid" id="results"></div>
    <p class="empty" id="no-results" hidden>No ideas match. Try fewer filters or a shorter search.</p>
    <nav class="pager" id="pager" aria-label="Pagination"></nav>
  </main>

  <!-- @footer -->

  <!-- Detail modal -->
  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal__close" data-close aria-label="Close">&times;</button>
      <div class="modal__body" id="modal-body"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
